<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
:root{--ink:#493c4a;--muted:#897b8a;--cream:#fffaf1;--lilac:#d9c1df;--gold:#efcf83}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:ui-rounded,"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 20%,#fffaf0,#f1e4f0 75%,#e6dce9)}
#stage{position:fixed;inset:0}canvas{width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;z-index:3;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.brand,.stats,.panel,.bottom{pointer-events:auto}.brand{display:flex;gap:9px;align-items:center;background:#fffdf4ed;border:1px solid white;border-radius:16px;padding:9px 13px;box-shadow:0 8px 24px #604a641c}
.orb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ead9ef;font-size:18px}.brand strong{font-size:14px;display:block}.brand small{font-size:9px;color:var(--muted)}
.stats{display:flex;gap:6px}.stat{min-width:66px;text-align:center;background:#fffdf4ed;border:1px solid white;border-radius:13px;padding:7px 9px;box-shadow:0 8px 24px #604a641c}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:var(--muted)}
.panel{position:fixed;z-index:5;left:50%;top:auto;bottom:58px;transform:translateX(-50%);width:min(540px,calc(100vw - 16px));max-height:36dvh;overflow:auto;background:#fffdf4f5;border:1px solid white;border-radius:18px;padding:10px;box-shadow:0 10px 28px #604a6420;scrollbar-width:thin}
.panel h2{font-size:13px;margin:0 0 6px}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:6px}.panelHead button{padding:3px 8px;background:#f0e6f1;color:#705c74;border-radius:8px;font-size:12px}.panelToggle{display:none;position:fixed;z-index:6;left:50%;top:auto;bottom:10px;transform:translateX(-50%);padding:10px 18px;border:1px solid white;border-radius:99px;background:#fffdf4f5;color:#493c4a;box-shadow:0 5px 16px #604a6420;font-size:12px;font-weight:850}.panel.hidden{display:none}.panelToggle.show{display:block}.desc{font-size:10px;line-height:1.6;color:var(--muted);margin:0 0 10px}
.progress{height:7px;background:#eee4ee;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c5a0d1,#edc878);transition:width .25s}
.small{font-size:10px;color:var(--muted);margin:5px 0 10px}
.partrow{display:grid;grid-template-columns:65px 1fr;align-items:center;gap:8px;margin:7px 0}.partrow label{font-size:10px;font-weight:700}
select{width:100%;border:1px solid #e7dce9;border-radius:9px;padding:8px 6px;background:#fff;color:#514352;font-size:10px}
button{border:0;border-radius:11px;padding:9px 10px;font:700 10px inherit;cursor:pointer}
.primary{background:#edcf81;color:#5c4932}.secondary{background:#f0e6f1;color:#705c74}.dark{background:#6f5879;color:white}
.actions{display:flex;gap:6px;margin-top:9px}.actions button{flex:1}
.upload{display:block;width:100%;margin-top:8px;padding:9px;border:1px dashed #c6a9cc;border-radius:10px;text-align:center;font-size:10px;color:#765d7c;background:#faf4fb;cursor:pointer}
.upload input{display:none}
.bottom{position:fixed;z-index:3;bottom:12px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#fffdf4ed;border:1px solid white;border-radius:99px;box-shadow:0 7px 22px #604a641c;font-size:10px;color:#79677c;white-space:nowrap}
.toast{position:fixed;z-index:6;left:50%;top:82px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:#59485e;color:white;padding:9px 15px;border-radius:99px;font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.win{position:fixed;z-index:8;inset:0;display:none;align-items:center;justify-content:center;background:#4b3a5070;backdrop-filter:blur(5px);padding:18px}.win.show{display:flex}.winCard{width:min(350px,100%);background:#fff9ee;border:3px solid white;border-radius:24px;padding:24px;text-align:center;box-shadow:0 20px 70px #38223b44}.winCard h1{font-size:22px;margin:7px}.winCard p{font-size:12px;line-height:1.7;color:var(--muted)}
#fileInput{display:none}
@media(max-width:700px){
.top{left:8px;right:8px;top:8px}.brand{padding:7px 9px;gap:6px}.orb{width:25px;height:25px;font-size:15px}.brand strong{font-size:11px}.brand small{font-size:8px}.stats{gap:4px}.stat{min-width:50px;padding:6px}.stat b{font-size:13px}.stat span{font-size:8px}
.panel{left:8px;right:8px;bottom:58px;top:auto;transform:none;width:auto;max-height:38dvh;padding:9px;border-radius:17px}
.panel h2{font-size:11px;margin:0}.panelHead{margin-bottom:6px}.panelHead button{font-size:11px;padding:3px 8px}
.desc{display:none}.progress{height:5px}.small{font-size:8px;margin:4px 0 6px}
#selectors{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
.partrow{grid-template-columns:45px 1fr;gap:4px;margin:4px 0}.partrow label{font-size:9px}
select{font-size:9px;padding:7px 4px;border-radius:8px}
.upload{font-size:9px;padding:7px;margin-top:6px}.actions{gap:5px;margin-top:6px}.actions button{padding:8px 5px;font-size:9px;border-radius:9px}
.transformActions button{font-size:10px;padding:9px 5px}
.bottom{display:none!important}
}
</style>

</head>

<div class="top"><div class="brand"><div class="orb">🧬</div><div><strong>寶可夢 DNA 基因工坊</strong><small>CROSS-POKÉMON FUSION</small></div></div>
<div class="stats"><div class="stat"><b id="doneCount">0 / 7</b><span>已組裝零件</span></div><div class="stat"><b id="clock">00:00</b><span>組裝時間</span></div></div></div>
<aside class="panel hidden" id="editorPanel">

<div id="selectors"></div>
<label class="upload">＋ 匯入另一隻寶可夢的 GLB 模型<input id="fileInput" type="file" accept=".glb,model/gltf-binary"></label>
<div class="small" id="libraryText">素材庫：超夢（1 隻）</div>
<div class="actions"><button class="primary" id="scatterBtn">散開零件</button><button class="secondary" id="resetBtn">重置位置</button></div>
<div class="actions transformActions"><button class="secondary" id="rotateLeft">↶ 左轉</button><button class="secondary" id="rotateRight">右轉 ↷</button><button class="secondary" id="scaleDown">縮小</button><button class="secondary" id="scaleUp">放大</button></div>
<div class="actions"><button class="dark" id="hintBtn">💡 提示未移動零件</button><button class="secondary" id="viewBtn">↻ 正面視角</button></div>
</aside>
<button id="panelOpen" class="panelToggle show">🧩 開啟零件工具</button>
<div class="bottom" style="display:none"></div>
<div class="toast" id="toast"></div>
<div class="win" id="win"><div class="winCard"><div style="font-size:45px">🌟🧬</div><h1>混合寶可夢組裝完成！</h1><p>你的專屬混合角色誕生了！你可以重置造型，繼續嘗試不同組合。</p><b id="finalTime"></b><br><button class="primary" id="closeWin" style="margin-top:12px">繼續創作</button></div></div>

  const core=new THREE.Mesh(mesh.geometry,new THREE.MeshBasicMaterial({color:0xff003c,side:THREE.BackSide,transparent:true,opacity:1,depthWrite:false,toneMapped:false}));
  core.userData.selectionOutline=true;core.scale.setScalar(1.045);core.renderOrder=21;mesh.add(core);outlineMeshes.push(core);
 }
}
function pointOnPlane(ev){const r=renderer.domElement.getBoundingClientRect();pointer.x=(ev.clientX-r.left)/r.width*2-1;pointer.y=-((ev.clientY-r.top)/r.height*2-1);raycaster.setFromCamera(pointer,camera);return raycaster.ray.intersectPlane(dragPlane,hit)?hit.clone():null;}
function pick(ev){
 const r=renderer.domElement.getBoundingClientRect();pointer.x=(ev.clientX-r.left)/r.width*2-1;pointer.y=-((ev.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);
 const meshes=[];ids.forEach(id=>{if(current[id])current[id].traverse(o=>{if(o.isMesh&&!o.userData.selectionOutline)meshes.push(o);});});
 const h=raycaster.intersectObjects(meshes,false);
 if(h.length){let node=h[0].object;while(node&&!ids.some(id=>current[id]===node))node=node.parent;return node||null;}
 // iPhone-friendly forgiving hit target: enlarge each part's bounding sphere for finger taps.
 let best=null,bestDistance=Infinity;
 for(const id of ids){const part=current[id];if(!part)continue;const box=getBounds(part),sphere=box.getBoundingSphere(new THREE.Sphere());sphere.radius=Math.max(sphere.radius*1.32,.24);
  const point=raycaster.ray.intersectSphere(sphere,new THREE.Vector3());if(point){const d=point.distanceTo(raycaster.ray.origin);if(d<bestDistance){bestDistance=d;best=part;}}
 }
 return best;
}
renderer.domElement.addEventListener('pointerdown',ev=>{if(!assembly)return;const obj=pick(ev);if(!obj){setActivePart(null);return;}let p=obj;while(p&&!ids.some(id=>current[id]===p))p=p.parent;if(!p)return;setActivePart(p);selected=p;controls.enabled=false;const q=pointOnPlane(ev);if(q)dragOffset.copy(p.position).sub(q);renderer.domElement.setPointerCapture(ev.pointerId);if(!clockStarted){clockStarted=true;startAt=performance.now();}});
renderer.domElement.addEventListener('pointermove',ev=>{if(!selected)return;const q=pointOnPlane(ev);if(q)selected.position.copy(q.add(dragOffset));});
renderer.domElement.addEventListener('pointerup',()=>{if(!selected)return;const dragged=selected;const id=ids.find(x=>current[x]===dragged);if(id){placed.add(id);say(names[id]+'已放在你指定的位置');updateProgress();}selected=null;controls.enabled=true;});
renderer.domElement.addEventListener('pointercancel',()=>{if(selected){selected=null;controls.enabled=true;}});
document.getElementById('scatterBtn').addEventListener('click',()=>startAssembly());
document.getElementById('resetBtn').addEventListener('click',resetModel);
document.getElementById('hintBtn').addEventListener('click',()=>{const id=ids.find(x=>!placed.has(x));if(!assembly){say('先按「散開零件」開始自由拼裝');return;}if(!id){say('全部完成！');return;}const o=current[id];o.scale.multiplyScalar(1.12);setTimeout(()=>o.scale.divideScalar(1.12),550);say('下一個零件：'+names[id]);});
document.getElementById('viewBtn').addEventListener('click',()=>{camera.position.set(0,2.4,10.8);controls.target.set(0,2.05,0);controls.update();});
document.getElementById('rotateLeft').addEventListener('click',()=>{if(activePart)activePart.rotation.z+=Math.PI/12;else say('先點選一個零件');});
document.getElementById('rotateRight').addEventListener('click',()=>{if(activePart)activePart.rotation.z-=Math.PI/12;else say('先點選一個零件');});
document.getElementById('scaleDown').addEventListener('click',()=>{if(activePart)activePart.scale.multiplyScalar(.9);else say('先點選一個零件');});
document.getElementById('scaleUp').addEventListener('click',()=>{if(activePart)activePart.scale.multiplyScalar(1.1);else say('先點選一個零件');});

document.getElementById('closeWin').addEventListener('click',()=>document.getElementById('win').classList.remove('show'));
document.getElementById('panelClose').addEventListener('click',()=>{document.getElementById('editorPanel').classList.add('hidden');document.getElementById('panelOpen').classList.add('show');});
document.getElementById('panelOpen').addEventListener('click',()=>{document.getElementById('editorPanel').classList.remove('hidden');document.getElementById('panelOpen').classList.remove('show');});
document.getElementById('fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{say('正在載入模型…');const buf=await file.arrayBuffer();const gltf=await createBase(buf);const name=file.name.replace(/\.glb$/i,'')||`新角色 ${library.length}`;addLibrary(name,gltf);}catch(err){console.error(err);say('匯入失敗：請使用含標準零件節點的 GLB');}e.target.value='';});
async function init(){
 try{const bytes=Uint8Array.from(atob(BASE64),c=>c.charCodeAt(0)).buffer;const gltf=await createBase(bytes);root=gltf.scene;scene.add(root);root.updateMatrixWorld(true);
  for(const id of ids){const part=findPart(root,id);if(!part)throw new Error('模型缺少節點 '+id);baseParts[id]=part;targetBoxes[id]=getBounds(part).clone();current[id]=part;initialPositions[id]=part.position.clone();part.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});}
  library.push({name:'超夢',scene:gltf.scene,parts:Object.fromEntries(ids.map(id=>[id,baseParts[id]]))});refreshSelectors();updateProgress();
 }catch(e){console.error(e);say('模型載入失敗，請確認網路後重新整理');}
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.position.z=innerWidth<650?12.5:10.8;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',resize);
function animate(now){requestAnimationFrame(animate);if(clockStarted&&assembly&&placed.size<7)document.getElementById('clock').textContent=fmt((now-startAt)/1000);controls.update();renderer.render(scene,camera);}
resize();init();requestAnimationFrame(animate);
