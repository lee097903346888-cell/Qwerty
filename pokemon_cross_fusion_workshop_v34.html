async function systemAutoFuse(jobId=fusionJobId){

 const torso=sources.find(o=>o.userData.partCategory==='torso');
 if(sources.length<2){
  setFusionPhase(FUSION_PHASES.collecting,'至少選擇身體與另一個部位');
  return;
 }
 if(!torso){
  setFusionPhase(FUSION_PHASES.waitingBody,'請先選擇身體，其他部位會以身體作為解剖中心');
  return;
 }

 let entries=[],pendingFused=null,pendingProxies=[],pendingMaterials=[];
 try{
  setFusionPhase(FUSION_PHASES.aligning,'依身體中心與部位類型計算解剖位置',0);
  sources.forEach(resetPartAssemblyTransform);
  for(const part of sources){if(part!==torso)alignForeignPartToTorso(part,torso);}
  workspaceRoot.updateMatrixWorld(true);
  await fusionYield();
  if(jobId!==fusionJobId)throw new Error('融合工作已取消');

  const {MeshBVH}=await import('https://esm.sh/three-mesh-bvh@0.8.3?external=three');
  if(jobId!==fusionJobId)throw new Error('融合工作已取消');
  entries=collectFusionSurfaceEntries(sources,MeshBVH);
  const grid=createFusionGrid(entries,72);

  setFusionPhase(FUSION_PHASES.voxelizing,'將各部位轉換為封閉體積',0);
  const {field,owner,blendRadius}=await buildSmoothUnionField(sources,entries,grid,jobId);
  if(jobId!==fusionJobId)throw new Error('融合工作已取消');

  setFusionPhase(FUSION_PHASES.remeshing,'以平滑距離場建立單一外表面',0);
  await fusionYield();
  const remesh=await extractVoxelSurface(field,owner,grid,entries,jobId);
  const geometry=remesh.geometry;
  pendingMaterials=remesh.materials;
  if(jobId!==fusionJobId){geometry.dispose();throw new Error('融合工作已取消');}

  setFusionPhase(FUSION_PHASES.validating,'檢查連通性、封閉邊與非流形邊',0);

  geometry.computeBoundingBox();geometry.computeBoundingSphere();

   geometry.dispose();throw new Error('重建表面座標無效');
  }

  if(topology.largestRatio<.90){
   geometry.dispose();
   throw new Error('主要表面仍分離（連通率 '+Math.round(topology.largestRatio*100)+'%）');
  }
  if(topology.boundaryEdges>0||topology.nonManifoldEdges>0){
   geometry.dispose();
   throw new Error('表面尚未完全封閉（開放邊 '+topology.boundaryEdges+'，非流形邊 '+topology.nonManifoldEdges+'）');
  }
  if(jobId!==fusionJobId){geometry.dispose();throw new Error('融合工作已取消');}

  const fusedMaterial=pendingMaterials.length?pendingMaterials:new THREE.MeshStandardMaterial({color:0xb5a8b9,roughness:.8});
  const fused=new THREE.Mesh(geometry,fusedMaterial);
  fused.name='PokemonVoxelRemeshedFusion';
  fused.userData.kind='fusedSurface';
  fused.userData.label='體素重塑融合模型';
  fused.userData.fusionAlgorithm='voxel-sdf-smooth-union';
  fused.userData.fusionPhase='ready';
  fused.userData.voxelResolution=72;
  fused.userData.voxelStep=grid.step;
  fused.userData.blendRadius=blendRadius;
  fused.userData.connectedRatio=topology.largestRatio;

  fused.userData.triangleCount=topology.triangles;

  const inverse=workspaceRoot.matrixWorld.clone().invert();
  for(const source of sources){
   source.updateWorldMatrix(true,true);
   const proxyNodes=[];
   source.traverse(node=>{
    if(!node.isMesh||!node.geometry?.attributes?.position)return;
    const proxyGeometry=node.geometry.clone();

  toast('融合完成：已重新塑形為單一封閉網格');

  pendingProxies.forEach(proxy=>{
   if(proxy.parent)proxy.parent.remove(proxy);

  }

  entries.forEach(disposeFusionEntry);

}

 if(Math.abs(xr)>.34&&yr>.34&&yr<.90&&zr<.12)return 'wings';

function extractSkinnedMeshParts(node,rootBounds,sourceName){

   let cat=weightedNamedCategory(v);
   if(cat==='other'){const bone=dominantBone(v);cat=classifyBoneName(bone,rootBounds);}

   return cat;
  });

  const bucket=materialBuckets.get(materialIndex);
  for(const v of ids){
   const wp=skinnedWorld(v);bucket.positions.push(wp.x,wp.y,wp.z);
   for(const n of attrNames){const a=g.attributes[n];for(let k=0;k<a.itemSize;k++)bucket.attrs[n].push(a.getComponent(v,k));}

 const worldToWorkspace=workspaceRoot.matrixWorld.clone().invert();

function normalizeModel(root){
 root.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(root);
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());
 // Shared rig: normalize by height, not wingspan/width. This keeps body/head/limb
 // coordinates comparable across species instead of shrinking wide Pokémon.
 const height=Math.max(size.y,.001),scale=2.8/height;
 if(root.children[0])root.children[0].position.sub(center);
 root.scale.setScalar(scale);
 root.position.set(0,(height*scale)/2,0);

 root.userData.baseScale=root.scale.clone();
 root.userData.sharedRig={height:2.8,sourceBounds:{x:size.x,y:size.y,z:size.z}};

// 1-finger blank drag = orbit camera; blank-space pinch = zoom camera.
// Tap a model = select only; blank-area drag = orbit; blank-area pinch = zoom.
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),activePointers=new Map();

let gesture=null;
function setGestureMode(mode){
 if(!(GESTURE_TRANSITIONS[gestureMachine.mode]||[]).includes(mode)){console.warn('Ignored invalid gesture transition:',gestureMachine.mode,'→',mode);return;}
 if(gestureMachine.mode!==mode){gestureMachine.history.push({from:gestureMachine.mode,to:mode,at:Date.now()});if(gestureMachine.history.length>30)gestureMachine.history.shift();}

function syncGestureState(){

 if(count===1){const only=[...activePointers.values()][0];gesture=null;setGestureMode(only.obj?'part-touch':'orbit');return;}
 const points=[...activePointers.values()].slice(0,2);
 if(points.every(p=>!p.obj)){
  const distance=Math.max(1,Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y));

}

 }

(function(){
 const labels={head:'頭部',torso:'身體',arms:'手',legs:'腳',tail:'尾巴',wings:'翅膀'};
 const names=["Bulbasaur", "Ivysaur", "Venusaur", "Charmander", "Charmeleon", "Charizard", "Squirtle", "Wartortle", "Blastoise", "Caterpie", "Metapod", "Butterfree", "Weedle", "Kakuna", "Beedrill", "Pidgey", "Pidgeotto", "Pidgeot", "Rattata", "Raticate", "Spearow", "Fearow", "Ekans", "Arbok", "Pikachu", "Raichu", "Sandshrew", "Sandslash", "Nidoran♀", "Nidorina", "Nidoqueen", "Nidoran♂", "Nidorino", "Nidoking", "Clefairy", "Clefable", "Vulpix", "Ninetales", "Jigglypuff", "Wigglytuff", "Zubat", "Golbat", "Oddish", "Gloom", "Vileplume", "Paras", "Parasect", "Venonat", "Venomoth", "Diglett", "Dugtrio", "Meowth", "Persian", "Psyduck", "Golduck", "Mankey", "Primeape", "Growlithe", "Arcanine", "Poliwag", "Poliwhirl", "Poliwrath", "Abra", "Kadabra", "Alakazam", "Machop", "Machoke", "Machamp", "Bellsprout", "Weepinbell", "Victreebel", "Tentacool", "Tentacruel", "Geodude", "Graveler", "Golem", "Ponyta", "Rapidash", "Slowpoke", "Slowbro", "Magnemite", "Magneton", "Farfetchd", "Doduo", "Dodrio", "Seel", "Dewgong", "Grimer", "Muk", "Shellder", "Cloyster", "Gastly", "Haunter", "Gengar", "Onix", "Drowzee", "Hypno", "Krabby", "Kingler", "Voltorb", "Electrode", "Exeggcute", "Exeggutor", "Cubone", "Marowak", "Hitmonlee", "Hitmonchan", "Lickitung", "Koffing", "Weezing", "Rhyhorn", "Rhydon", "Chansey", "Tangela", "Kangaskhan", "Horsea", "Seadra", "Goldeen", "Seaking", "Staryu", "Starmie", "Mr Mime", "Scyther", "Jynx", "Electabuzz", "Magmar", "Pinsir", "Tauros", "Magikarp", "Gyarados", "Lapras", "Ditto", "Eevee", "Vaporeon", "Jolteon", "Flareon", "Porygon", "Omanyte", "Omastar", "Kabuto", "Kabutops", "Aerodactyl", "Snorlax", "Articuno", "Zapdos", "Moltres", "Dratini", "Dragonair", "Dragonite", "Mewtwo", "Mew"];
 let lastTap=0,lastPart='';
 function diag(msg,isError){
  const d=document.getElementById('v29Diag'),h=document.getElementById('hint');
  if(d){d.textContent=msg;d.classList.add('show');d.style.background=isError?'#ffe5e5':'#f4e8f3';d.style.color=isError?'#8a2525':'#604969';}
  if(h)h.textContent=msg;
 }
 function makeFallbackList(){
  const list=document.getElementById('splitCatalog');
  if(!list||list.querySelector('.modelChoice'))return;
  list.innerHTML='';
  names.forEach((name,i)=>{
   const b=document.createElement('button');
   b.type='button';b.className='choice modelChoice';
   b.innerHTML='<div class="preview" style="font-size:25px">🧬</div><b>'+name+'</b><small>#'+(i+1)+' · 點擊載入 3D 模型</small>';
   b.addEventListener('click',function(){
    if(window.__pokemonModuleReady&&window.__loadPokemonModel){
     window.__loadPokemonModel('https://raw.githubusercontent.com/Pokemon-3D-api/assets/main/models/opt/regular/'+(i+1)+'.glb',name);
    }else{
     diag('已收到模型選取，但 3D 引擎尚未啟動。請確認網路可連線，並把下方錯誤訊息截圖給我。',true);
    }
   });
   list.appendChild(b);
  });
 }
 window.__partClickV29=function(part,button){
  const now=Date.now();
  if(now-lastTap<350&&lastPart===part)return;
  lastTap=now;lastPart=part;
  if(button)button.dataset.v29Handled='1';
  document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.part===part));
  const shelf=document.getElementById('shelf');
  const title=document.getElementById('shelfTitle');
  const split=document.getElementById('splitPane');
  const catalog=document.getElementById('splitCatalog');
  const library=document.getElementById('partLibrary');
  if(shelf)shelf.classList.add('open');
  if(title)title.textContent='選擇'+(labels[part]||'寶可夢');
  if(split)split.classList.add('active');
  if(catalog)catalog.hidden=false;
  if(library)library.hidden=true;
  diag('已收到「'+(labels[part]||part)+'」點擊。正在檢查 3D 引擎…',false);
  if(window.__pokemonModuleReady&&window.__openPokemonCategory){
   try{
    window.__openPokemonCategory(part);
    const d=document.getElementById('v29Diag');if(d)d.classList.remove('show');
    return;
   }catch(e){diag('點擊有收到，但開啟清單失敗：'+(e.message||e),true);}
  }else{
   makeFallbackList();
   setTimeout(function(){
    if(!window.__pokemonModuleReady){
     diag('按鈕已正常收到點擊，但 3D 引擎沒有啟動。請確認網路可連線；如果你是直接開啟 HTML，請改用 Chrome 重新開啟。',true);
    }
   },1800);
  }
 };
 window.addEventListener('error',function(e){
  const msg=(e.message||e.error&&e.error.message||'未知錯誤');
  diag('程式錯誤：'+String(msg).slice(0,150),true);
 },true);
 window.addEventListener('unhandledrejection',function(e){
  const msg=e.reason&&e.reason.message||e.reason||'未知錯誤';
  diag('載入錯誤：'+String(msg).slice(0,150),true);
 });
})();
</script>



<script>
(function(){
 const close=document.getElementById('closeShelf');
 if(close)close.addEventListener('click',function(){document.getElementById('shelf')?.classList.remove('open');});
})();
</script>
