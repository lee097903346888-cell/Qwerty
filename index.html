<!doctype html>

<style>

@media(max-width:620px){
 .top{left:10px;right:10px;gap:5px}.brand{gap:7px;padding:8px 9px;border-radius:16px;max-width:240px}.brandIcon{width:35px;height:35px;font-size:21px}.brand h1{font-size:11px}.brand small{font-size:8px;letter-spacing:.2px}.topRight{gap:4px}.topRight button{padding:8px 8px;min-height:44px;border-radius:13px;font-size:11px}.topRight .statusBtn{min-width:37px;font-size:9px;max-width:45px}
 #status{top:calc(env(safe-area-inset-top) + 75px);font-size:10px;max-width:75vw;padding:6px 12px}

 #picker{left:8px;top:calc(env(safe-area-inset-top) + 111px);bottom:calc(env(safe-area-inset-bottom) + 108px);width:47vw;min-width:168px;padding:9px;border-radius:18px;gap:7px}
 .pickerHead b{font-size:13px}.pickerHead button{width:30px;height:30px}#sourceSearch{font-size:16px;padding:9px}
 .sourceCard{min-height:78px;padding:4px;gap:5px;border-radius:12px}.sourceImage{width:69px;height:70px;flex-basis:69px;border-radius:9px}.sourceText{gap:3px}.sourceText b{font-size:10px}.sourceText small{font-size:8px}.codeLine{font-size:8px}.pickMark{font-size:13px;padding:1px}
 #zoomControls{right:7px;gap:7px}#zoomControls button{height:43px;width:43px;border-radius:13px;font-size:26px}#zoomControls button:last-child{font-size:21px}
 #bottomBar{gap:4px;padding:8px 7px;bottom:calc(env(safe-area-inset-bottom) + 11px);border-radius:19px}.partButton{width:52px;height:61px;border-radius:13px}.partIcon{font-size:23px}.partButton small{font-size:9px}
 #recipeBadge{bottom:calc(env(safe-area-inset-bottom) + 96px);max-width:90vw;padding:6px 9px}#recipeCode{font-size:9px}#meshStats{font-size:8px}

}
@media (max-width:370px){.brand h1{font-size:10px}.topRight button{padding:8px 5px}.partButton{width:46px;height:59px}.sourceImage{width:60px;flex-basis:60px}}
</style>
</head>
<body>
<canvas id="gameCanvas" aria-label="3D DNA 融合模型。拖曳可旋轉視角，雙指縮放。"></canvas>
<header class="top">
 <div class="brand"><div class="brandIcon">🧬</div><div><h1>寶可夢自由拼裝工坊</h1><small>V35 · DNA CODE FUSION</small></div></div>
 <div class="topRight"><button class="statusBtn" id="fusionStatus" disabled>生成中</button><button id="albumBtn">🃏 圖冊</button><button id="gearBtn" aria-label="設定">⚙</button><button id="clearBtn">清空</button></div>
</header>
<div id="status" role="status">準備 3D 引擎…</div>
<div id="progressWrap"><div id="progressFill"></div></div>
<aside id="picker" aria-label="寶可夢部位來源">
 <div class="pickerHead"><b id="pickerTitle">選擇頭部</b><button id="closePicker" aria-label="關閉選單">×</button></div>
 <input id="sourceSearch" type="search" placeholder="搜尋寶可夢名稱或編號" aria-label="搜尋寶可夢">
 <div id="sourceList"></div>
</aside>
<div id="zoomControls"><button id="zoomIn" aria-label="放大">+</button><button id="zoomOut" aria-label="縮小">−</button><button id="frontView" aria-label="恢復正面視角">↺</button></div>
<div id="recipeBadge"><span id="recipeCode">DNA-006-006-006-006-006-006</span><small id="meshStats">生成中…</small></div>
<button id="removeRole" title="刪除這個部位" aria-label="刪除目前所選部位">×</button>
<div id="bottomBar" aria-label="六大部位選擇"></div>
<div id="toast" role="alert"></div>
<div class="modal" id="settingsModal"><div class="modalCard">
 <div class="modalHead"><h2>⚙ 系統設定</h2><button id="closeSettings">關閉</button></div>
 <div class="settingRow"><div><b>模型生成精細度</b><small>精細模式需要較多運算時間</small></div><select id="qualitySelect"><option value="43">流暢</option><option value="52">標準</option><option value="60">精細</option></select></div>
 <div class="settingRow"><div><b>選取部位紅色輪廓</b><small>顯示選擇部位的紅色高光</small></div><input id="outlineCheck" type="checkbox" checked></div>
 <div class="settingRow rangeRow"><div><b>輪廓強度 <output id="outlineStrengthValue">5.2</output></b></div><input id="outlineStrength" type="range" min="0.5" max="10" step="0.1" value="5.2"></div>
 <div class="settingRow rangeRow"><div><b>螢光光暈 <output id="outlineGlowValue">0.9</output></b></div><input id="outlineGlow" type="range" min="0" max="3" step="0.1" value="0.9"></div>
 <div class="settingRow rangeRow"><div><b>輪廓粗細 <output id="outlineThicknessValue">2.1</output></b></div><input id="outlineThickness" type="range" min="0.5" max="6" step="0.1" value="2.1"></div>
 <div class="modalActions"><button id="copyRecipe" class="secondary">複製 DNA 配方</button><button id="importRecipe" class="secondary">匯入 DNA 配方</button><button id="exportGLB">匯出新模型 GLB</button></div>
 <input id="recipeOutput" value="DNA-006-006-006-006-006-006" aria-label="可複製或貼入的 DNA 配方">
 <span id="infoNote">這是以六組寶可夢特徵代碼重新生成的新 3D 公仔，不是原始官方 GLB 的網格重組。融合後只有一份封閉模型網格。</span>
</div></div>
<div class="modal" id="albumModal"><div class="modalCard">
 <div class="modalHead"><h2>🃏 我的融合圖冊</h2><button id="closeAlbum">關閉</button></div>
 <div id="albumItems"></div>
 <div class="modalActions"><button id="saveCard">收藏這隻新模型</button><button class="secondary" onclick="document.getElementById('albumModal').classList.remove('show');document.getElementById('gearBtn').click()">匯出 GLB</button></div>
</div></div>
<script>
/* V35 pure JS procedural fusion kernel; no external dependency. */
const FusionCore = (() => {
 'use strict';
 const roles=['head','body','arms','legs','tail','wings'];
 const roleText={head:'頭部',body:'身體',arms:'手',legs:'腳',tail:'尾巴',wings:'翅膀'};
 const DNA={
  '006':{name:'噴火龍',en:'Charizard',body:'#F68C45',belly:'#FFE0A8',accent:'#E46A3B',head:'#F6A052',wing:'#188C9B',tail:'#ED743C',eye:'#266D91',build:1.02,headR:1.0,snout:1.1,ear:'horn',horn:2,arms:1.0,legs:1.0,wingStyle:'dragon',tailStyle:'flame',shell:false},
  '009':{name:'水箭龜',en:'Blastoise',body:'#4D91D8',belly:'#EBD5A0',accent:'#604A38',head:'#5C9DE1',wing:'#388DA3',tail:'#5D8FCC',eye:'#284C94',build:1.24,headR:1.0,snout:.84,ear:'none',horn:0,arms:.95,legs:1.1,wingStyle:null,tailStyle:'short',shell:true},
  '003':{name:'妙蛙花',en:'Venusaur',body:'#49B5A3',belly:'#89DEBA',accent:'#D85E81',head:'#55C2AF',wing:'#58A27C',tail:'#58A27C',eye:'#CF3959',build:1.25,headR:1.12,snout:1.03,ear:'point',horn:0,arms:.85,legs:.85,wingStyle:null,tailStyle:'short',bulb:true},
  '150':{name:'超夢',en:'Mewtwo',body:'#DAD4EA',belly:'#EEEAF6',accent:'#8E63AD',head:'#E7E1F2',wing:'#9E78BF',tail:'#A77BC7',eye:'#8A477F',build:.8,headR:1.05,snout:.72,ear:'antenna',horn:2,arms:1.16,legs:1.08,wingStyle:null,tailStyle:'long'},
  '149':{name:'快龍',en:'Dragonite',body:'#EAB261',belly:'#F9E2B1',accent:'#D18C43',head:'#F0BB6F',wing:'#6AB6A0',tail:'#E2A04D',eye:'#3B7484',build:1.12,headR:1.03,snout:1.06,ear:'antenna',horn:2,arms:.98,legs:.96,wingStyle:'leaf',tailStyle:'long'},
  '012':{name:'巴大蝶',en:'Butterfree',body:'#8F9CD8',belly:'#C6C9E8',accent:'#6E709F',head:'#919EE1',wing:'#F5F4FF',tail:'#7E91C9',eye:'#CE476A',build:.82,headR:1.00,snout:.64,ear:'antenna',horn:2,arms:.58,legs:.5,wingStyle:'butterfly',tailStyle:'short'}
 };
 const DEFAULT={head:'006',body:'006',arms:'006',legs:'006',tail:'006',wings:'006'};
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const lerp=(a,b,t)=>a+(b-a)*t;
 const len=(x,y,z)=>Math.hypot(x,y,z);
 const smin=(a,b,k)=>{if(!Number.isFinite(a))return b;if(!Number.isFinite(b))return a;if(k<=0)return Math.min(a,b);const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25;};
 function ell(x,y,z,cx,cy,cz,rx,ry,rz){
  const a=(x-cx)/rx,b=(y-cy)/ry,c=(z-cz)/rz;
  const k0=Math.hypot(a,b,c);
  const k1=Math.hypot(a/rx,b/ry,c/rz);
  return k0*(k0-1)/(k1||1);
 }
 function segment(x,y,z,ax,ay,az,bx,by,bz,ra,rb){
  const vx=bx-ax,vy=by-ay,vz=bz-az;
  const t=clamp(((x-ax)*vx+(y-ay)*vy+(z-az)*vz)/(vx*vx+vy*vy+vz*vz||1),0,1);
  return len(x-ax-vx*t,y-ay-vy*t,z-az-vz*t)-lerp(ra,rb,t);
 }
 function polygonSD(x,y,poly){
  let inside=false,min2=1e12;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
   const a=poly[j],b=poly[i],vx=b[0]-a[0],vy=b[1]-a[1];
   const t=clamp(((x-a[0])*vx+(y-a[1])*vy)/(vx*vx+vy*vy||1),0,1);
   const dx=x-a[0]-t*vx,dy=y-a[1]-t*vy;
   min2=Math.min(min2,dx*dx+dy*dy);
   if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])inside=!inside;
  }
  return (inside?-1:1)*Math.sqrt(min2);
 }
 function partDistance(role,x,y,z,dna){
  const b=dna.build;
  if(role==='body'){
   let v=ell(x,y,z,0,1.08,0,.61*b,.73*b,.49*b);
   v=smin(v,ell(x,y,z,0,1.42,-.02,.47*b,.43*b,.46*b),.12);
   if(dna.shell){v=smin(v,ell(x,y,z,0,1.15,-.45,.63*b,.66*b,.30*b),.12);}
   if(dna.bulb){v=smin(v,ell(x,y,z,0,1.71,-.38,.66,.49,.53),.16);}
   return v;
  }
  if(role==='head'){
   let v=ell(x,y,z,0,2.12,.13,.51*dna.headR,.45*dna.headR,.46*dna.headR);
   v=smin(v,segment(x,y,z,0,1.55,0,0,2.02,.08,.29*b,.32*dna.headR),.18);
   v=smin(v,ell(x,y,z,0,1.92,.52,.35*dna.snout,.20*dna.snout,.36*dna.snout),.12);
   if(dna.ear==='horn'||dna.ear==='point'){
    for(const sign of [-1,1]){
     v=smin(v,segment(x,y,z,sign*.35,2.40,-.03,sign*.53,2.84,-.05,.15,.018),.07);
    }
   }else if(dna.ear==='antenna'){
    for(const sign of [-1,1]){
     v=smin(v,segment(x,y,z,sign*.27,2.37,-.06,sign*.54,2.71,.03,.145,.073),.10);
    }
   }
   return v;
  }
  if(role==='arms'){
   let v=1e4;

   if(rollback&&state.validRecipe)state.recipe={...state.validRecipe};
   else if(rollback)state.recipe=rollback;
   phase('error','新模型未完成：'+message);

   log('Fusion failed: '+message);toast('無法生成新模型：'+message);

 // Pointer navigation: rotate the view, never move a model part.
 const touches=new Map();let lastPinch=0,lastDrag=null;
 const canvas=$('#gameCanvas');
 canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch')e.preventDefault();
  canvas.setPointerCapture?.(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===1)lastDrag={x:e.clientX,y:e.clientY};
  if(touches.size===2){const a=[...touches.values()];lastPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
 },{passive:false});
 canvas.addEventListener('pointermove',e=>{
  if(!touches.has(e.pointerId))return;
  const prev=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===1){
   const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
   state.yaw-=dx*.008;state.pitch=clamp(state.pitch+dy*.004,0,.72);scheduleRender();
  }else if(touches.size===2){
   const a=[...touches.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
   if(lastPinch>0){state.dist=clamp(state.dist*(lastPinch/dist),4.6,40);scheduleRender();}
   lastPinch=dist;
  }
 });
 const endPointer=e=>{touches.delete(e.pointerId);if(touches.size<2)lastPinch=0;};
 canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
 canvas.addEventListener('wheel',e=>{e.preventDefault();state.dist=clamp(state.dist*(e.deltaY>0?1.1:.9),4.6,40);scheduleRender();},{passive:false});
 $('#zoomIn').onclick=()=>{state.dist=clamp(state.dist*.85,4.6,40);scheduleRender();};
 $('#zoomOut').onclick=()=>{state.dist=clamp(state.dist*1.16,4.6,40);scheduleRender();};
 $('#frontView').onclick=()=>{state.yaw=0;state.pitch=.08;state.dist=state.picker?(innerWidth<=620?31:10.5):(innerWidth<=620?18.5:8.7);scheduleRender();toast('已恢復正面視角');};
 $('#removeRole').onclick=()=>{
  const role=state.role;if(!state.recipe[role])return;
  const rollback={...state.recipe};state.recipe[role]=null;renderBottom();
  regenerate('移除'+SHORT_LABEL[role],rollback);

 $('#clearBtn').onclick=()=>{
  state.job++;state.recipe={head:null,body:null,arms:null,legs:null,tail:null,wings:null};
  if(state.gpu)renderer?.dispose(state.gpu);state.gpu=null;state.mesh=null;state.validRecipe=null;writeLocal('pokemonFusionV35Recipe',state.recipe);

  $('#fusionStatus').textContent='等待身體';$('#meshStats').textContent='尚未生成模型';
  $('#saveCard').disabled=true;$('#exportGLB').disabled=true;

 // Settings stay in the gear menu, matching earlier versions.
 const settings=$('#settingsModal');
 $('#gearBtn').onclick=()=>{settings.classList.add('show');$('#qualitySelect').value=String(state.quality);$('#outlineCheck').checked=state.highlight;$('#recipeOutput').value=CORE.recipeCode(state.recipe);
  for(const [id,key] of [['outlineStrength','outlineStrength'],['outlineGlow','outlineGlow'],['outlineThickness','outlineThickness']]){
   $('#'+id).value=String(state[key]);$('#'+id+'Value').textContent=Number(state[key]).toFixed(1);
  }
 };
 $('#closeSettings').onclick=()=>settings.classList.remove('show');
 $('#qualitySelect').onchange=()=>{const q=Number($('#qualitySelect').value);if(![43,52,60].includes(q))return;state.quality=q;saveFusionSettings();if(state.mesh)regenerate('調整模型精細度');};
 $('#outlineCheck').onchange=()=>{state.highlight=$('#outlineCheck').checked;saveFusionSettings();scheduleRender();};
 function saveFusionSettings(){writeLocal('pokemonFusionV35Settings',{quality:state.quality,highlight:state.highlight,outlineStrength:state.outlineStrength,outlineGlow:state.outlineGlow,outlineThickness:state.outlineThickness});}
 for(const [id,key] of [['outlineStrength','outlineStrength'],['outlineGlow','outlineGlow'],['outlineThickness','outlineThickness']]){
  $('#'+id).addEventListener('input',()=>{state[key]=Number($('#'+id).value);$('#'+id+'Value').textContent=state[key].toFixed(1);saveFusionSettings();scheduleRender();});
 }

 $('#importRecipe').onclick=()=>{
  const code=$('#recipeOutput').value.trim().toUpperCase();
  const pattern=/^DNA-([0-9]{3})-([0-9]{3})-([0-9]{3})-([0-9]{3})-([0-9]{3})-([0-9]{3})$/;
  const match=code.match(pattern);
  if(!match){toast('配方格式不正確，請使用 DNA-006-009-... 六組編號');return;}
  const next={},previous={...state.recipe};
  for(let i=0;i<CORE.roles.length;i++){
   const role=CORE.roles[i],id=match[i+1];
   if(id!=='000'&&!CORE.DNA[id]){toast('不支援的角色代碼：'+id);return;}
   if(role==='wings'&&id!=='000'&&!CORE.DNA[id]?.wingStyle){toast('這隻寶可夢沒有翅膀代碼：'+id);return;}
   next[role]=id==='000'?null:id;
  }
  state.recipe=next;settings.classList.remove('show');renderBottom();
  regenerate('匯入 DNA 配方',previous);
 };
 $('#copyRecipe').onclick=async()=>{
  const code=CORE.recipeCode(state.recipe);
  try{await navigator.clipboard.writeText(code);toast('已複製 DNA 配方代碼');}
  catch{const field=$('#recipeOutput');field.value=code;field.focus();field.select();toast('請複製已選取的配方');}
 };
 // Actual GLB export, using raw glTF 2.0 binary container with vertex colors.
 function createGLB(mesh,recipe){
  const segments=[],views=[],accessors=[];let size=0;
  const addSegment=(array,target)=>{
   const bytes=new Uint8Array(array.buffer,array.byteOffset,array.byteLength);
   const aligned=(size+3)&~3;size=aligned;
   const vi=views.length;views.push({buffer:0,byteOffset:size,byteLength:bytes.length,...(target?{target}:{})});
   segments.push({offset:size,data:bytes});size+=bytes.length;
   return vi;
  };
  function accessor(array,type,componentType,count,target,min,max){
   const vi=addSegment(array,target),a={bufferView:vi,componentType,count,type};
   if(min)a.min=min;if(max)a.max=max;
   const i=accessors.length;accessors.push(a);return i;
  }
  const pos=mesh.position,normal=mesh.normal,colors=mesh.color,indices=mesh.indices;
  const min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];
  for(let i=0;i<pos.length;i+=3)for(let j=0;j<3;j++){const v=pos[i+j];min[j]=Math.min(min[j],v);max[j]=Math.max(max[j],v);}
  const aPos=accessor(pos,'VEC3',5126,pos.length/3,34962,min,max);
  const aNormal=accessor(normal,'VEC3',5126,normal.length/3,34962);
  const aColor=accessor(colors,'VEC3',5126,colors.length/3,34962);
  const aIdx=accessor(indices,'SCALAR',indices instanceof Uint32Array?5125:5123,indices.length,34963);
  const totalBin=(size+3)&~3,bin=new Uint8Array(totalBin);
  for(const a of segments)bin.set(a.data,a.offset);
  const gltf={asset:{version:'2.0',generator:'Pokémon DNA Fusion Workshop V35 procedural SDF'},
   scene:0,scenes:[{nodes:[0]}],nodes:[{mesh:0,name:'DNA Fusion: '+CORE.recipeCode(recipe)}],
   meshes:[{name:'One watertight fusion mesh',primitives:[{attributes:{POSITION:aPos,NORMAL:aNormal,COLOR_0:aColor},indices:aIdx,material:0,mode:4}]}],
   materials:[{name:'Original DNA palette',pbrMetallicRoughness:{baseColorFactor:[1,1,1,1],metallicFactor:0,roughnessFactor:.75},doubleSided:false}],
   buffers:[{byteLength:totalBin}],bufferViews:views,accessors,
   extras:{recipe:{...recipe},definition:'Procedural character based on DNA parameters, not original source GLB geometry'}
  };
  const enc=new TextEncoder(),jBytes=enc.encode(JSON.stringify(gltf)),jLength=(jBytes.length+3)&~3;
  const glb=new ArrayBuffer(12+8+jLength+8+totalBin),dv=new DataView(glb),dst=new Uint8Array(glb);
  dv.setUint32(0,0x46546c67,true);dv.setUint32(4,2,true);dv.setUint32(8,glb.byteLength,true);
  dv.setUint32(12,jLength,true);dv.setUint32(16,0x4e4f534a,true);
  dst.set(jBytes,20);for(let i=20+jBytes.length;i<20+jLength;i++)dst[i]=0x20;
  dv.setUint32(20+jLength,totalBin,true);dv.setUint32(24+jLength,0x004e4942,true);
  dst.set(bin,28+jLength);
  return new Blob([glb],{type:'model/gltf-binary'});
 }
 function downloadBlob(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
 $('#exportGLB').onclick=()=>{
  if(!state.mesh)return toast('請先生成融合模型');
  const code=CORE.recipeCode(state.recipe);
  try{downloadBlob(createGLB(state.mesh,state.recipe),'pokemon_fusion_'+code+'.glb');toast('已開始匯出新的 GLB 模型');}
  catch(err){toast('匯出失敗：'+err.message);}
 };
 // Album and saved recipes.
 function thumbCanvas(){const canvas=document.createElement('canvas');canvas.width=220;canvas.height=180;const ctx=canvas.getContext('2d');ctx.fillStyle='#F3EBF2';ctx.fillRect(0,0,canvas.width,canvas.height);try{ctx.drawImage($('#gameCanvas'),0,0,canvas.width,canvas.height);}catch{}return canvas.toDataURL('image/jpeg',.72);}
 function saveCard(){
  if(!state.mesh)return toast('尚未生成新模型');
  const item={id:Date.now(),recipe:{...state.recipe},code:CORE.recipeCode(state.recipe),preview:thumbCanvas(),date:new Date().toLocaleString('zh-TW'),stats:state.mesh.stats};
  state.album.unshift(item);state.album=state.album.slice(0,16);
  if(!writeLocal('pokemonFusionV35Cards',state.album))toast('裝置無法儲存圖冊，請確認瀏覽器儲存設定');
  else toast('已將新的融合模型存入圖冊');renderAlbum();
 }
 $('#saveCard').onclick=saveCard;
 const album=$('#albumModal');
 $('#albumBtn').onclick=()=>{renderAlbum();album.classList.add('show');};
 $('#closeAlbum').onclick=()=>album.classList.remove('show');
 function renderAlbum(){
  $('#albumItems').innerHTML=state.album.length?state.album.map(item=>`<div class="albumRow"><img src="${item.preview||''}" alt="融合模型縮圖"><div><b>${item.code||'DNA 模型'}</b><small>${item.date||''}</small><button data-load="${item.id}">載入配方</button></div></div>`).join(''):'<p class="shelfEmpty">還沒有收藏的融合模型。</p>';
  $$('[data-load]').forEach(b=>b.onclick=()=>{const item=state.album.find(x=>String(x.id)===b.dataset.load);if(!item)return;state.recipe={...item.recipe};album.classList.remove('show');renderBottom();regenerate('從圖冊重新生成');});

 function start(){

  const previous=readLocal('pokemonFusionV35Recipe',null);
