<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5edf5">
<title>寶可夢自由融合工坊 V51</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
:root{--ink:#4c3e50;--muted:#907e92;--plum:#795982;--paper:#fffdf7;--line:#eaddec;--shadow:0 12px 34px #5b41651c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5edf5;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;z-index:3;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.brand,.status{background:#fffdf4ed;border:1px solid white;border-radius:20px;box-shadow:var(--shadow);padding:11px 15px;pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}
.brandIcon{width:42px;height:42px;border-radius:14px;background:#f0dff2;display:grid;place-items:center;font-size:25px}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;margin-top:2px}
.status{font-size:12px;font-weight:800;color:var(--muted);max-width:46vw;text-align:center}
#viewReset{position:fixed;z-index:3;right:14px;top:calc(env(safe-area-inset-top) + 82px);width:42px;height:42px;border:1px solid white;border-radius:14px;background:#fffdf4;color:var(--plum);font-size:21px;box-shadow:var(--shadow)}
#dock{position:fixed;z-index:4;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:9px;padding:10px;background:#fffdf4ed;border:1px solid white;border-radius:23px;box-shadow:var(--shadow)}
#dock button{min-width:0;min-height:58px;border:2px solid var(--line);border-radius:16px;background:white;color:var(--ink);font-weight:900;padding:8px 6px;font-size:14px;overflow:hidden;text-overflow:ellipsis}
#dock button span{display:block;color:var(--muted);font-size:10px;font-weight:750;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock #fuse{background:var(--plum);color:white;border-color:var(--plum);font-size:17px}
#dock #fuse:disabled{opacity:.45}
#picker{position:fixed;z-index:10;inset:0;background:#241b2b77;display:none;align-items:center;justify-content:center;padding:14px}
#picker.show{display:flex}
#pickerCard{width:min(560px,100%);height:min(720px,86dvh);background:var(--paper);border:1px solid white;border-radius:24px;padding:14px;display:flex;flex-direction:column;box-shadow:0 20px 60px #241b2b44}
.pickerHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pickerHead h2{font-size:18px;margin:0}
.pickerHead button{border:0;border-radius:12px;background:#f2e6f2;color:var(--plum);font-size:22px;width:40px;height:40px}
#search{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;outline:none;background:white;color:var(--ink)}
#list{overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;padding-bottom:8px}
.card{border:1px solid var(--line);border-radius:14px;background:white;padding:12px;text-align:left;color:var(--ink);font-weight:850;min-height:66px}
.card small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
#toast{position:fixed;z-index:20;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);max-width:90vw;padding:11px 16px;background:#433449;color:white;border-radius:16px;font-size:13px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(max-width:520px){
 .brand{padding:9px 11px}.brandIcon{width:36px;height:36px}
 .brand strong{font-size:14px}.status{font-size:10px;padding:9px 10px}
 #dock{gap:6px;padding:8px}#dock button{font-size:12px;min-height:56px}
 #dock #fuse{font-size:15px}
}
</style>
</head>
<body>
<canvas id="stage" aria-label="可旋轉縮放的寶可夢融合 3D 展示"></canvas>
<header>
 <div class="brand"><div class="brandIcon">🧬</div><div><strong>寶可夢自由融合工坊</strong><small>V51 · SIMPLE FUSION VIEWER</small></div></div>
 <div class="status" id="status">正在載入寶可夢圖鑑…</div>
</header>
<button id="viewReset" aria-label="重設視角" title="重設視角">↺</button>
<nav id="dock" aria-label="融合操作">
 <button id="pickA">選擇寶可夢 A<span id="nameA">尚未選擇</span></button>
 <button id="pickB">選擇寶可夢 B<span id="nameB">尚未選擇</span></button>
 <button id="fuse" disabled>✨ 融合</button>
</nav>
<div id="picker">
 <div id="pickerCard">
  <div class="pickerHead"><h2 id="pickerTitle">選擇寶可夢</h2><button id="closePicker" aria-label="關閉">×</button></div>
  <input id="search" type="search" placeholder="搜尋名稱或圖鑑編號">
  <div id="list"><p>正在載入圖鑑…</p></div>
 </div>
</div>
<div id="toast" role="status"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const $=id=>document.getElementById(id);
const canvas=$('stage');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf5edf5);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.25,6.2);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.localClippingEnabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.07;
controls.target.set(0,1.05,0);controls.minDistance=2.5;controls.maxDistance=12;
controls.maxPolarAngle=Math.PI*.88;
scene.add(new THREE.HemisphereLight(0xffffff,0xb9a9bd,2.1));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(4,7,6);scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,1.1);fill.position.set(-5,3,-4);scene.add(fill);

const platform=new THREE.Group();
const disc=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.9,.12,96),new THREE.MeshStandardMaterial({color:0xf0d9f2,roughness:.62,metalness:.05}));
disc.position.y=.05;platform.add(disc);
const rim=new THREE.Mesh(new THREE.TorusGeometry(1.82,.035,12,96),new THREE.MeshStandardMaterial({color:0xb987c2,roughness:.45,metalness:.08}));
rim.rotation.x=Math.PI/2;rim.position.y=.12;platform.add(rim);scene.add(platform);

const loader=new GLTFLoader();
let catalog=[],filtered=[],targetSlot='A',selected={A:null,B:null},currentFusion=null,loading=false,toastTimer;
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600);}
function status(message){$('status').textContent=message;}
function updateButtons(){
 $('nameA').textContent=selected.A?selected.A.name+' #'+selected.A.id:'尚未選擇';
 $('nameB').textContent=selected.B?selected.B.name+' #'+selected.B.id:'尚未選擇';
 $('fuse').disabled=!(selected.A&&selected.B)||loading;
}
function openPicker(slot){targetSlot=slot;$('pickerTitle').textContent='選擇寶可夢 '+slot;$('search').value='';drawList();$('picker').classList.add('show');$('search').focus();}
function closePicker(){$('picker').classList.remove('show');}
$('pickA').onclick=()=>openPicker('A');
$('pickB').onclick=()=>openPicker('B');
$('closePicker').onclick=closePicker;
$('picker').addEventListener('click',e=>{if(e.target===$('picker'))closePicker();});
$('search').addEventListener('input',drawList);
function drawList(){
 const q=$('search').value.trim().toLowerCase();
 filtered=catalog.filter(p=>String(p.id).includes(q)||p.name.toLowerCase().includes(q));
 $('list').innerHTML=filtered.slice(0,300).map(p=>`<button class="card" data-id="${p.id}">${escapeHTML(p.name)}<small>#${p.id} · ${escapeHTML(p.form)}</small></button>`).join('')||'<p>找不到符合的寶可夢。</p>';
 $('list').querySelectorAll('.card').forEach(b=>b.onclick=()=>{
  const item=filtered.find(p=>p.id===Number(b.dataset.id));if(!item)return;
  selected[targetSlot]=item;updateButtons();closePicker();
  if(selected.A&&selected.B)status('已選擇 '+selected.A.name+' + '+selected.B.name+'，可以開始融合');
  else status('已選擇 '+item.name+'，再選擇另一隻寶可夢');
 });
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadCatalog(){
 try{
  const res=await fetch('https://pokemon-3d-api.onrender.com/v1/pokemon');
  if(!res.ok)throw new Error('圖鑑服務回應 '+res.status);
  const data=await res.json(),list=data.pokemon||data;
  catalog=[];
  for(const p of list){
   const forms=p.forms||[];
   const form=forms.find(f=>f.formName==='regular'&&f.model)||forms.find(f=>f.model);
   if(form&&form.model)catalog.push({id:Number(p.id),name:form.name||p.name||('Pokemon '+p.id),form:form.formName||'regular',url:form.model});
  }
  catalog.sort((a,b)=>a.id-b.id);drawList();
  status('圖鑑已載入 · '+catalog.length+' 隻可選');
 }catch(err){
  status('圖鑑載入失敗，請確認網路後重新整理');
  $('list').innerHTML='<p>無法連線到寶可夢模型庫。請確認網路連線後重新整理頁面。</p>';
  console.error(err);
 }
}
function cloneWithClip(root,plane){
 const copy=root.clone(true);
 copy.traverse(obj=>{
  if(!obj.isMesh)return;
  const mats=Array.isArray(obj.material)?obj.material: [obj.material];
  const cloned=mats.map(mat=>{const m=mat.clone();m.clippingPlanes=[plane];m.clipShadows=true;return m;});
  obj.material=Array.isArray(obj.material)?cloned:cloned[0];
  obj.castShadow=true;obj.receiveShadow=true;
 });
 return copy;
}
function normalizeRoot(root){
 root.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(root);
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());
 const height=Math.max(size.y,.001);
 const scale=2.35/height;
 root.scale.multiplyScalar(scale);
 root.position.set(-center.x*scale,-center.y*scale,-center.z*scale);
 root.updateMatrixWorld(true);
}
async function loadModel(item){
 const gltf=await loader.loadAsync(item.url);
 const root=gltf.scene;
 normalizeRoot(root);
 return root;
}
async function fuse(){
 if(loading||!selected.A||!selected.B)return;
 loading=true;updateButtons();status('正在載入並融合模型…');
 try{
  const [modelA,modelB]=await Promise.all([loadModel(selected.A),loadModel(selected.B)]);
  if(currentFusion){scene.remove(currentFusion);disposeGroup(currentFusion);}
  const combined=new THREE.Group();combined.name='PokemonFusionPreview';
  const leftPlane=new THREE.Plane(new THREE.Vector3(1,0,0),0);
  const rightPlane=new THREE.Plane(new THREE.Vector3(-1,0,0),0);
  combined.add(cloneWithClip(modelA,leftPlane));
  combined.add(cloneWithClip(modelB,rightPlane));
  combined.position.y=1.28;
  scene.add(combined);currentFusion=combined;
  // Show a single centered hybrid preview, with one Pokémon contributing the left half and the other the right half.
  camera.position.set(0,1.55,6.4);controls.target.set(0,1.25,0);controls.update();
  status('融合完成 · '+selected.A.name+' × '+selected.B.name);
  toast('融合預覽已完成，可以旋轉及縮放欣賞');
 }catch(err){
  console.error(err);status('模型載入失敗，請重新選擇或稍後再試');
  toast('模型載入失敗：'+(err?.message||'請檢查網路'));
 }finally{loading=false;updateButtons();}
}
function disposeGroup(group){
 group.traverse(o=>{
  if(o.isMesh){
   o.geometry?.dispose();
   const mats=Array.isArray(o.material)?o.material:[o.material];
   mats.forEach(m=>m?.dispose());
  }
 });
}
$('fuse').onclick=fuse;
$('viewReset').onclick=()=>{camera.position.set(0,1.55,6.4);controls.target.set(0,1.25,0);controls.update();};
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));}
addEventListener('resize',resize);
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();updateButtons();loadCatalog();
</script>
