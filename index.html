<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>寶可夢專用融合 AI V54</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5edf5;color:#493b50;font-family:system-ui,"Noto Sans TC",sans-serif;padding:20px}
main{max-width:760px;margin:auto;background:#fffdf8;border-radius:22px;padding:22px;box-shadow:0 12px 40px #493b501c}
h1{font-size:23px;margin:0 0 6px}p{color:#817386;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
label{display:block;border:2px dashed #d9c8df;border-radius:16px;padding:16px;background:#fff;text-align:center;font-weight:800}
input{display:block;width:100%;margin-top:12px;font-size:12px}
button{border:0;border-radius:13px;padding:14px 18px;background:#795982;color:white;font-size:16px;font-weight:900;width:100%;margin-top:10px}
button:disabled{opacity:.4}#status{background:#f3eaf4;border-radius:12px;padding:12px;margin-top:14px;white-space:pre-wrap;font-size:13px}
#preview{width:100%;height:420px;border-radius:16px;background:#eee;margin-top:14px;display:none;touch-action:none}
small{color:#98899d;font-weight:500}
@media(max-width:520px){body{padding:10px}main{padding:16px}.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>🧬 寶可夢專用融合 AI</h1>
<p>選擇兩份 GLB 模型，系統分析網格後執行體積聯集，輸出一份新的 GLB。介面只保留選擇、融合、觀賞。</p>
<div class="grid">
<label>寶可夢 A<input id="a" type="file" accept=".glb,model/gltf-binary"><small id="an">尚未選擇</small></label>
<label>寶可夢 B<input id="b" type="file" accept=".glb,model/gltf-binary"><small id="bn">尚未選擇</small></label>
</div>
<button id="fuse" disabled>✨ 開始融合</button>
<div id="status">請先啟動本機融合引擎，再選擇兩個 GLB 模型。</div>
<a id="download" style="display:none" download="pokemon_fusion_v54.glb">下載融合模型 GLB</a>
<canvas id="preview" aria-label="融合結果 3D 預覽"></canvas>
<p><small>注意：這是幾何體素融合原型，並非已訓練的語意 AI。可能改變細節與原始材質；兩個模型最好是封閉網格。</small></p>
</main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),api='http://127.0.0.1:8765';
let resultUrl=null,renderer,camera,scene,controls,model;
const canvas=$('preview');
function initViewer(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0xeee8f0);
 camera=new THREE.PerspectiveCamera(35,1,.01,100);camera.position.set(0,1.5,5);
 renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
 controls=new OrbitControls(camera,canvas);controls.enableDamping=true;
 scene.add(new THREE.HemisphereLight(0xffffff,0x8b7a91,2));
 const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,4);scene.add(light);
 function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
 new ResizeObserver(resize).observe(canvas);resize();
 function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);}loop();
}
async function showModel(blob){
 if(!renderer)initViewer();
 if(model){scene.remove(model);model.traverse(o=>{if(o.isMesh){o.geometry.dispose();(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose());}});}
 const url=URL.createObjectURL(blob);
 const gltf=await new GLTFLoader().loadAsync(url);model=gltf.scene;scene.add(model);
 const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 const scale=2.4/Math.max(size.x,size.y,size.z,0.001);model.scale.setScalar(scale);model.position.copy(center.multiplyScalar(-scale));
 camera.position.set(0,1.3,5);controls.target.set(0,0,0);controls.update();
 $('preview').style.display='block';
}
async function ping(){try{let r=await fetch(api+'/health');let d=await r.json();$('status').textContent=d.ok?'融合引擎已連線。請選擇兩個 GLB 模型。':'融合引擎未就緒。'}catch(e){$('status').textContent='尚未連線本機融合引擎。請先執行資料夾中的 start_windows.bat。'}}
function check(){ $('an').textContent=$('a').files[0]?.name||'尚未選擇';$('bn').textContent=$('b').files[0]?.name||'尚未選擇';$('fuse').disabled=!($('a').files[0]&&$('b').files[0]);}
$('a').onchange=check;$('b').onchange=check;
$('fuse').onclick=async()=>{
 const a=$('a').files[0],b=$('b').files[0];if(!a||!b)return;
 $('fuse').disabled=true;$('status').textContent='正在分析兩份模型並執行體積融合，請稍候…';
 try{
  const fd=new FormData();fd.append('model_a',a);fd.append('model_b',b);
  const response=await fetch(api+'/fuse?resolution=72',{method:'POST',body:fd});
  if(!response.ok){const err=await response.json();throw new Error(err.detail||'融合失敗');}
  const blob=await response.blob();if(resultUrl)URL.revokeObjectURL(resultUrl);resultUrl=URL.createObjectURL(blob);
  $('download').href=resultUrl;$('download').style.display='inline-block';$('download').textContent='下載融合後的 GLB 模型';
  await showModel(blob);
  $('status').textContent='融合完成！已產生單一 GLB 模型。可在下方拖曳旋轉、縮放觀賞。';
 }catch(e){$('status').textContent='融合失敗：'+e.message;}
 finally{$('fuse').disabled=false;}
};
ping();
</script></script><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"7939e04a4baf43c8b86a560f74aac60e","spa":2}' crossorigin="anonymous"></script>
