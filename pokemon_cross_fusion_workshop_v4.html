<style>
:root{--ink:#403746;--muted:#897b8c;--paper:#fffaf2;--line:#eadfea;--plum:#70557a;--gold:#efd18b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:#f3eaf3}

.logo{width:29px;height:29px;border-radius:10px;background:#ead9ef;display:grid;place-items:center;font-size:17px}.brand b{display:block;font-size:12px}.brand small{font-size:8px;color:var(--muted)}
.topRight{display:flex;gap:6px}.topRight button{border:1px solid white;border-radius:12px;background:#fffdf2ed;padding:9px 11px;font-size:10px;font-weight:800;color:var(--ink);box-shadow:0 5px 18px #5b46631a}
#hint{position:fixed;z-index:2;top:62px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fffdf0dc;border:1px solid white;border-radius:99px;padding:6px 10px;font-size:9px;color:#786b7b;pointer-events:none}
#toast{position:fixed;z-index:9;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,8px);opacity:0;background:#55445b;color:white;padding:8px 13px;border-radius:99px;font-size:10px;white-space:nowrap;transition:.18s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
/* Category toolbar: compact square tiles at bottom */
#bottomBar{position:fixed;z-index:5;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:5px;padding:7px;background:#fffdf4ed;border:1px solid white;border-radius:18px;box-shadow:0 8px 25px #59445f24;backdrop-filter:blur(10px)}
.cat{width:clamp(39px,11vw,52px);height:48px;border:1px solid #eee3ef;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#65566c;padding:2px;flex:none}
.cat .ico{font-size:19px;line-height:20px}.cat small{font-size:8px;font-weight:800}.cat.active{background:#73577d;color:white;border-color:#73577d}
/* Left part shelf */
#shelf{position:fixed;z-index:6;left:8px;top:70px;bottom:calc(75px + env(safe-area-inset-bottom));width:112px;display:none;flex-direction:column;background:#fffdf5f2;border:1px solid white;border-radius:17px;padding:8px;box-shadow:0 8px 24px #59445f25;backdrop-filter:blur(10px)}
#shelf.open{display:flex}
.shelfHead{display:flex;align-items:center;justify-content:space-between;gap:3px;margin-bottom:6px}.shelfHead b{font-size:10px}.shelfHead button{border:0;border-radius:8px;background:#f1e8f2;padding:4px 7px;font-size:11px;color:#6e5875}
#species{display:flex;flex-direction:column;gap:4px;margin-bottom:7px}
.species{border:1px solid #eadfea;border-radius:9px;background:white;padding:6px 4px;font-size:9px;font-weight:800;color:#625467;text-align:left}
.species.active{background:#f0e5f3;border-color:#c6a6cf}
#partChoices{overflow:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.choice{border:1px solid #eee5ef;border-radius:10px;background:#fff;padding:5px;display:flex;align-items:center;gap:5px;min-height:48px;text-align:left;color:#514554}
.choice .swatch{width:33px;height:33px;border-radius:9px;display:grid;place-items:center;background:#f7f0f7;font-size:19px;flex:none}
.choice b{font-size:8px;line-height:1.25}.choice:active{transform:scale(.97);background:#f4eaf5}
#selection{position:fixed;z-index:5;right:9px;bottom:calc(74px + env(safe-area-inset-bottom));display:none;flex-wrap:wrap;gap:5px;max-width:72%;justify-content:flex-end}
#selection.show{display:flex}
#selection button{border:1px solid white;border-radius:10px;background:#fffdf2ed;padding:8px 9px;font-size:10px;font-weight:800;color:#5c4c62;box-shadow:0 4px 12px #59445f18}
#selection button.danger{background:#fbe9e8;color:#9d4b4b}
#albumModal{position:fixed;z-index:12;inset:0;background:#40334480;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px)}
#albumModal.show{display:flex}.albumCard{width:min(390px,100%);max-height:80dvh;overflow:auto;background:#fffaf1;border:2px solid white;border-radius:22px;padding:14px;box-shadow:0 18px 55px #30203555}
.albumHead{display:flex;align-items:center;justify-content:space-between}.albumHead h2{font-size:16px;margin:0}.albumHead button{border:0;background:#f0e6f1;border-radius:9px;padding:7px 10px}
#albumItems{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.albumItem{background:#fff;border:1px solid #eadfea;border-radius:13px;padding:9px;min-height:90px}.albumItem b{font-size:11px;display:block}.albumItem small{font-size:9px;color:var(--muted)}
.albumActions{display:flex;gap:7px;margin-top:10px}.albumActions button{flex:1;border:0;border-radius:11px;padding:10px;background:#73577d;color:white;font-size:10px;font-weight:800}
.empty{grid-column:1/-1;padding:25px 10px;text-align:center;color:var(--muted);font-size:11px}
@media(min-width:760px){#bottomBar{left:50%;right:auto;transform:translateX(-50%);gap:8px}.cat{width:58px;height:56px}.cat .ico{font-size:22px}#shelf{width:145px;top:78px;bottom:90px}#hint{top:72px}}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {OutlinePass} from 'three/addons/postprocessing/OutlinePass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0xf5edf5);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(0,2.7,9.8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;stage.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.5,0);controls.enableDamping=true;controls.dampingFactor=.075;controls.enablePan=true;controls.minDistance=5;controls.maxDistance=18;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xffffff,0x8e7c93,2.0));
const key=new THREE.DirectionalLight(0xffffff,2.1);key.position.set(-4,8,7);scene.add(key);
const fill=new THREE.DirectionalLight(0xe5c9f0,1.1);fill.position.set(5,4,-5);scene.add(fill);
const floor=new THREE.Mesh(new THREE.CircleGeometry(10,64),new THREE.MeshStandardMaterial({color:0xfff8ef,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.75;scene.add(floor);
const platform=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.3,.15,64),new THREE.MeshStandardMaterial({color:0xe7d5e9,roughness:.72}));platform.position.y=-1.66;scene.add(platform);
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.17,.035,10,64),new THREE.MeshStandardMaterial({color:0xc69ecb}));ring.rotation.x=Math.PI/2;ring.position.y=-1.57;scene.add(ring);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const outline=new OutlinePass(new THREE.Vector2(innerWidth,innerHeight),scene,camera);outline.edgeStrength=5.5;outline.edgeGlow=1.0;outline.edgeThickness=2.4;outline.pulsePeriod=0;outline.visibleEdgeColor.set('#ff1744');outline.hiddenEdgeColor.set('#ff1744');composer.addPass(outline);composer.addPass(new OutputPass());

const C={yellow:0xffd84d,yellow2:0xf0b72e,cream:0xffefc0,red:0xee6865,brown:0x70452e,brown2:0x9a6847,purple:0xc9a8d0,purple2:0x8f6a9c,lavender:0xe5d9e9,white:0xf6f0f6,dark:0x493c4a,black:0x2e2830,green:0x75b77a};
const material=(c,rough=.64)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
function ball(g,c,p,s){const m=new THREE.Mesh(new THREE.SphereGeometry(1,28,20),material(c));m.position.set(...p);m.scale.set(...s);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}
function capsule(g,c,a,b,r){const d=new THREE.Vector3(...b).sub(new THREE.Vector3(...a));const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,Math.max(.01,d.length()-2*r),6,16),material(c));m.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.castShadow=true;g.add(m);return m}
function cone(g,c,p,rot,scale){const m=new THREE.Mesh(new THREE.ConeGeometry(.16,.72,18),material(c));m.position.set(...p);m.rotation.set(...rot);m.scale.set(...scale);m.castShadow=true;g.add(m);return m}
function tailTube(g,c,pts,r){const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));const m=new THREE.Mesh(new THREE.TubeGeometry(curve,40,r,14,false),material(c));m.castShadow=true;g.add(m);return m}
function makePart(species,id){
 const g=new THREE.Group();g.userData.species=species;g.userData.part=id;
 const pika=species==='pika',mew=species==='mew',eev=species==='eevee';
 const base=pika?C.yellow:mew?C.lavender:C.brown2,shade=pika?C.yellow2:mew?C.purple2:C.brown;
 if(id==='head'){
  ball(g,base,[0,0,0],pika?[.58,.52,.47]:mew?[.57,.65,.47]:[.58,.54,.49]);
  if(pika){capsule(g,shade,[-.31,.32,0],[-.44,1.03,0],.12);capsule(g,base,[.31,.32,0],[.44,1.03,0],.12);ball(g,C.brown,[-.44,.96,.02],[.08,.15,.09]);ball(g,C.brown,[.44,.96,.02],[.08,.15,.09]);ball(g,C.dark,[-.22,.02,.42],[.052,.08,.03]);ball(g,C.dark,[.22,.02,.42],[.052,.08,.03]);ball(g,C.red,[-.4,-.16,.37],[.12,.1,.04]);ball(g,C.red,[.4,-.16,.37],[.12,.1,.04]);ball(g,C.cream,[0,-.18,.4],[.13,.07,.035]);}
  if(mew){capsule(g,C.white,[-.34,.34,0],[-.45,.91,0],.11);capsule(g,C.white,[.34,.34,0],[.45,.91,0],.11);ball(g,C.white,[0,.39,-.02],[.24,.34,.27]);ball(g,C.purple2,[-.22,-.03,.42],[.07,.13,.035]);ball(g,C.purple2,[.22,-.03,.42],[.07,.13,.035]);ball(g,C.dark,[0,-.2,.43],[.07,.04,.03]);}
  if(eev){cone(g,shade,[-.35,.58,0],[-.12,0,.12],[.9,1.25,.9]);cone(g,shade,[.35,.58,0],[-.12,0,-.12],[.9,1.25,.9]);ball(g,C.cream,[0,-.18,.4],[.24,.17,.08]);ball(g,C.dark,[-.2,.02,.44],[.05,.075,.03]);ball(g,C.dark,[.2,.02,.44],[.05,.075,.03]);ball(g,C.brown,[0,-.19,.45],[.065,.045,.025]);}
 }
 if(id==='torso'){ball(g,base,[0,0,0],pika?[.42,.57,.34]:mew?[.4,.62,.34]:[.43,.58,.36]);if(pika)ball(g,C.cream,[0,-.13,.29],[.26,.3,.07]);if(mew){ball(g,C.white,[0,.18,.28],[.24,.29,.07]);ball(g,C.purple2,[0,-.34,.2],[.18,.16,.06]);}if(eev){ball(g,C.cream,[0,.03,.32],[.34,.36,.09]);ball(g,C.cream,[0,.4,.2],[.29,.2,.08]);}}
 if(id==='left_arm'||id==='right_arm'){const d=id==='left_arm'?-1:1;capsule(g,base,[0,.18,0],[d*.2,-.28,.02],pika?.13:.12);ball(g,base,[d*.2,-.31,.02],[.15,.14,.14]);if(mew){for(let i=0;i<3;i++)capsule(g,C.white,[d*.2,-.3,.03],[d*(.3+i*.05),-.48,.04],.035);}if(eev)ball(g,C.cream,[d*.2,-.31,.13],[.1,.07,.035]);}
 if(id==='left_leg'||id==='right_leg'){const d=id==='left_leg'?-1:1;capsule(g,base,[0,.18,0],[d*.08,-.32,.02],pika?.15:.13);ball(g,base,[d*.1,-.36,.14],[pika?.21:.19,.12,.27]);if(mew)ball(g,C.white,[d*.1,-.36,.2],[.1,.05,.17]);if(eev)ball(g,C.brown,[d*.1,-.36,.2],[.11,.055,.18]);}
 if(id==='tail'){
  if(pika){tailTube(g,C.yellow2,[[0,-.45,0],[.18,-.18,0],[.16,.08,0],[.45,.2,0],[.45,.48,0],[.76,.48,0],[.76,.76,0]],.13);const tip=new THREE.Mesh(new THREE.BoxGeometry(.33,.25,.15),material(C.yellow));tip.position.set(.76,.77,0);g.add(tip);}
  if(mew){tailTube(g,C.purple2,[[0,-.48,0],[.25,-.25,0],[.52,.02,0],[.7,.38,0],[.52,.72,0],[.18,.84,0]],.19);tailTube(g,C.purple,[[0,-.48,.03],[.25,-.25,.03],[.52,.02,.03],[.7,.38,.03],[.52,.72,.03],[.18,.84,.03]],.1);}
  if(eev){ball(g,C.brown,[.1,.05,0],[.36,.35,.25]);ball(g,C.cream,[.3,.23,.02],[.28,.27,.2]);ball(g,C.brown,[.47,.4,0],[.2,.22,.16]);}
 }
 return g;
}
const labels={head:'頭部',torso:'身體',left_arm:'左手',right_arm:'右手',left_leg:'左腳',right_leg:'右腳',tail:'尾巴'};
const icons={head:'🙂',torso:'🧍',left_arm:'💪',right_arm:'💪',left_leg:'🦶',right_leg:'🦶',tail:'〰️'};
let activePartType='head',activeSpecies='pika',selected=null,objects=[],nextSpawn=0;
const shelf=document.querySelector('#shelf'),choices=document.querySelector('#partChoices');
function openShelf(id){activePartType=id;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.part===id));document.querySelector('#shelfTitle').textContent='選擇'+labels[id];shelf.classList.add('open');renderChoices();}
function renderChoices(){choices.innerHTML='';[['pika','皮卡丘','⚡'],['mew','超夢','🔮'],['eevee','伊布','🦊']].forEach(([sp,n,ic])=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="swatch">${ic}</span><b>${n}<br>${labels[activePartType]}</b>`;b.onclick=()=>addPart(sp,activePartType);choices.append(b);});}
document.querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>openShelf(b.dataset.part)));
document.querySelector('#closeShelf').onclick=()=>shelf.classList.remove('open');

function addPart(species,id){
 const obj=makePart(species,id);const row=objects.length%4,col=Math.floor(objects.length/4);
 // New parts enter the left-side staging zone; players may move them anywhere.
 obj.position.set(-2.0+(row*.24),.25+(col*.28),.15);obj.rotation.y=0;obj.userData.label=(species==='pika'?'皮卡丘':species==='mew'?'超夢':'伊布')+'・'+labels[id];
 scene.add(obj);objects.push(obj);select(obj);shelf.classList.remove('open');toast(obj.userData.label+'已加入工作區，可自由移動');updateCount();
}
function updateCount(){document.querySelector('#hint').textContent=`工作區 ${objects.length} 件｜短按選取・長按拖曳・空白處旋轉視角`;}
function select(obj){selected=obj;outline.selectedObjects=obj?[obj]:[];document.querySelector('#selection').classList.toggle('show',!!obj);}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1500);}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),0),hit=new THREE.Vector3(),offset=new THREE.Vector3();
let press=null,pressTimer=null,dragging=false,moved=false;
function cast(ev){const r=renderer.domElement.getBoundingClientRect();pointer.x=(ev.clientX-r.left)/r.width*2-1;pointer.y=-((ev.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);}
function hitObject(ev){cast(ev);const meshes=[];objects.forEach(g=>g.traverse(o=>{if(o.isMesh)meshes.push(o)}));const h=raycaster.intersectObjects(meshes,false);if(!h.length)return null;let n=h[0].object;while(n&&!objects.includes(n))n=n.parent;return n||null;}
function planePoint(ev){cast(ev);return raycaster.ray.intersectPlane(plane,hit)?hit.clone():null;}
renderer.domElement.addEventListener('pointerdown',ev=>{
 const obj=hitObject(ev);if(!obj){press=null;return;}
 select(obj);press={obj,x:ev.clientX,y:ev.clientY,id:ev.pointerId};moved=false;dragging=false;
 pressTimer=setTimeout(()=>{if(press&&!moved){dragging=true;controls.enabled=false;const p=planePoint(ev);if(p)offset.copy(obj.position).sub(p);toast('移動中：拖到你想放置的位置');}},360);
});
window.addEventListener('pointermove',ev=>{
 if(!press)return;
 const dist=Math.hypot(ev.clientX-press.x,ev.clientY-press.y);
 if(!dragging&&dist>9){moved=true;clearTimeout(pressTimer);press=null;return;} // allow OrbitControls to rotate camera
 if(dragging&&press){const p=planePoint(ev);if(p)press.obj.position.copy(p.add(offset));}
});
window.addEventListener('pointerup',()=>{clearTimeout(pressTimer);if(dragging){controls.enabled=true;toast('已放置在新位置');}press=null;dragging=false;});
window.addEventListener('pointercancel',()=>{clearTimeout(pressTimer);controls.enabled=true;press=null;dragging=false;});

function transformSelected(fn){if(selected)fn(selected);}
document.querySelector('#rotL').onclick=()=>transformSelected(o=>o.rotation.z+=Math.PI/12);
document.querySelector('#rotR').onclick=()=>transformSelected(o=>o.rotation.z-=Math.PI/12);
document.querySelector('#scaleDown').onclick=()=>transformSelected(o=>o.scale.multiplyScalar(.9));
document.querySelector('#scaleUp').onclick=()=>transformSelected(o=>o.scale.multiplyScalar(1.1));
document.querySelector('#duplicate').onclick=()=>{if(!selected)return;const c=selected.clone(true);c.position.x+=.3;c.position.y-=.2;scene.add(c);objects.push(c);select(c);updateCount();};
document.querySelector('#delete').onclick=()=>{if(!selected)return;scene.remove(selected);objects=objects.filter(o=>o!==selected);select(null);updateCount();};
document.querySelector('#resetBtn').onclick=()=>{objects.forEach(o=>scene.remove(o));objects=[];select(null);shelf.classList.remove('open');updateCount();toast('工作區已清空');};

// Album: snapshots of the user's assembled part recipe, not an image render.
const albumKey='pokemonFusionAlbumV4';
function readAlbum(){try{return JSON.parse(localStorage.getItem(albumKey)||'[]')}catch{return[]}}
function renderAlbum(){const arr=readAlbum(),box=document.querySelector('#albumItems');box.innerHTML='';if(!arr.length){box.innerHTML='<div class="empty">圖冊還沒有卡牌。先自由拼裝，再把作品收藏起來吧！</div>';return;}arr.forEach((card,i)=>{const d=document.createElement('div');d.className='albumItem';d.innerHTML=`<b>🌟 ${card.name}</b><small>${card.count} 個零件 · ${new Date(card.date).toLocaleDateString()}</small>`;box.append(d);});}
document.querySelector('#albumBtn').onclick=()=>{renderAlbum();document.querySelector('#albumModal').classList.add('show');};
document.querySelector('#closeAlbum').onclick=()=>document.querySelector('#albumModal').classList.remove('show');
document.querySelector('#saveCard').onclick=()=>{if(objects.length<2){toast('至少放入 2 個零件才能收藏');return;}const arr=readAlbum();arr.unshift({name:'自訂混合寶可夢 '+(arr.length+1),count:objects.length,date:Date.now(),parts:objects.map(o=>({species:o.userData.species,part:o.userData.part,position:o.position.toArray(),rotation:o.rotation.toArray(),scale:o.scale.toArray()}))});localStorage.setItem(albumKey,JSON.stringify(arr));renderAlbum();toast('作品已收藏到卡牌圖冊');};

document.querySelector('#rotL').title='向左旋轉';document.querySelector('#rotR').title='向右旋轉';
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);composer.setSize(w,h);outline.setSize(w,h);}
addEventListener('resize',resize);
function animate(){requestAnimationFrame(animate);controls.update();composer.render();}
resize();animate();
</script>
