<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7edf5">
<title>寶可夢自由 3D 拼裝工坊</title>
<style>
:root{--ink:#403746;--muted:#897c8c;--paper:#fffaf2;--line:#eadfea;--plum:#73577d;--gold:#efcf82}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(145deg,#fffaf2,#f0e5f2)}
#app{height:100dvh;min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 9px env(safe-area-inset-bottom);gap:7px}
header{height:43px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 3px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}.logo{width:32px;height:32px;border-radius:11px;background:#ead9ef;display:grid;place-items:center;font-size:18px}
.brand b{font-size:13px;display:block}.brand small{font-size:8px;color:var(--muted);letter-spacing:.5px}
.topActions{display:flex;gap:5px}.topActions button{border:1px solid var(--line);background:#fffdf8;border-radius:10px;padding:7px 9px;font-size:10px;font-weight:800;color:var(--ink)}
#stageWrap{position:relative;flex:1;min-height:220px;border-radius:22px;overflow:hidden;border:1px solid white;background:radial-gradient(ellipse at 50% 38%,#fffdf8,#f0e3f1 78%);box-shadow:0 8px 22px #765c7020}
#stage{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.stageTop{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.chip{background:#fffdf1e8;border:1px solid #fff;border-radius:99px;padding:7px 10px;font-size:9px;color:#786a7a;box-shadow:0 3px 10px #6a52621a}
#toast{position:absolute;bottom:10px;left:50%;transform:translate(-50%,8px);opacity:0;background:#55445b;color:white;padding:8px 12px;border-radius:99px;font-size:10px;white-space:nowrap;transition:.18s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.tools{flex:none;background:#fffdf7;border:1px solid white;border-radius:19px;padding:9px 10px 8px;box-shadow:0 8px 22px #765c7018}
.toolhead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:7px}
.toolhead strong{font-size:12px}.toolhead span{font-size:9px;color:var(--muted)}
.toolbar{display:flex;gap:5px;margin-bottom:8px}
.toolbar button{flex:1;border:0;border-radius:10px;padding:8px 5px;background:#f1e9f2;color:#725f78;font-size:10px;font-weight:800}
.toolbar button.active{background:#73577d;color:white}
.toolbar button:disabled{opacity:.35}
#speciesTabs{display:flex;gap:6px;margin-bottom:7px}
.speciesTab{flex:1;border:1px solid var(--line);border-radius:10px;padding:7px;background:white;font-size:10px;font-weight:800;color:var(--ink)}
.speciesTab.active{border-color:#b894c5;background:#f7eff8}
#partsTray{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;padding:1px 1px 5px;scrollbar-width:thin}
.partCard{flex:0 0 68px;height:64px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:none;user-select:none}
.partCard:active{background:#f4eaf5;transform:scale(.97)}
.partCard .emoji{font-size:23px;line-height:1}.partCard b{font-size:9px;color:#66596b}
#selectionTools{display:none;align-items:center;gap:5px;margin-top:6px;padding-top:6px;border-top:1px solid #f0e8f0}
#selectionTools.show{display:flex}
#selectionTools .selectedName{font-size:9px;font-weight:800;min-width:43px}
#selectionTools button{border:0;border-radius:9px;background:#f0e7f2;color:#695571;padding:7px 9px;font-size:10px;font-weight:800}
#selectionTools button.delete{background:#fae7e5;color:#9a514a;margin-left:auto}
footer{flex:none;text-align:center;font-size:8px;color:#8b7e8d;padding-bottom:1px}
@media(max-height:700px){header{height:38px}.tools{padding:7px 8px 6px}.partCard{height:56px;flex-basis:62px}.partCard .emoji{font-size:20px}.toolbar button{padding:7px 4px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
<header>
 <div class="brand"><div class="logo">🧩</div><div><b>自由 3D 拼裝工坊</b><small>DRAG · DROP · CREATE</small></div></div>
 <div class="topActions"><button id="viewBtn">正面視角</button><button id="clearBtn">清空作品</button></div>
</header>
<section id="stageWrap">
 <div id="stage"></div>
 <div class="stageTop"><span class="chip">工作區：自由放置，沒有固定答案</span><span class="chip" id="count">已放置 0 件</span></div>
 <div id="toast"></div>
</section>
<section class="tools">
 <div class="toolhead"><strong>👆 按住零件，拖進上方工作區</strong><span>可任意位置拼接</span></div>
 <div class="toolbar">
  <button id="rotateLeft" disabled>↶ 旋轉</button><button id="smaller" disabled>－ 縮小</button><button id="bigger" disabled>＋ 放大</button><button id="rotateRight" disabled>旋轉 ↷</button>
 </div>
 <div id="speciesTabs">
  <button class="speciesTab active" data-species="pika">⚡ 皮卡丘零件</button>
  <button class="speciesTab" data-species="mew">🔮 超夢零件</button>
 </div>
 <div id="partsTray"></div>
 <div id="selectionTools">
  <span class="selectedName" id="selectedName">已選取</span>
  <button id="front">移到前面</button>
  <button id="duplicate">複製</button>
  <button class="delete" id="delete">刪除</button>
 </div>
</section>
<footer>拖曳零件到舞台；點選已放置的零件可再次移動、旋轉、縮放或刪除。</footer>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const stageWrap=document.querySelector('#stageWrap'),stage=document.querySelector('#stage');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,.1,100);camera.position.set(0,2.3,9.4);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setSize(stageWrap.clientWidth,stageWrap.clientHeight);stage.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.4,0);orbit.enableDamping=true;orbit.dampingFactor=.07;orbit.enablePan=false;orbit.minDistance=6;orbit.maxDistance=14;orbit.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xffffff,0x8c7891,2));
const key=new THREE.DirectionalLight(0xffffff,2.1);key.position.set(-4,7,6);scene.add(key);
const fill=new THREE.DirectionalLight(0xe7c9f1,1.2);fill.position.set(4,3,-4);scene.add(fill);
const floor=new THREE.Mesh(new THREE.CircleGeometry(5,48),new THREE.MeshStandardMaterial({color:0xfff7ef,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.2;scene.add(floor);
const board=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.4,.12,64),new THREE.MeshStandardMaterial({color:0xe9d9ed,roughness:.7}));board.position.set(0,-2.05,0);scene.add(board);
const boardRing=new THREE.Mesh(new THREE.TorusGeometry(2.28,.025,8,64),new THREE.MeshStandardMaterial({color:0xc49bc9}));boardRing.rotation.x=Math.PI/2;boardRing.position.y=-1.98;scene.add(boardRing);

const C={yellow:0xffd84d,yellow2:0xf2b72e,cream:0xffefc0,red:0xee6865,brown:0x513a34,purple:0xc9a8d0,purple2:0x8f6a9c,lavender:0xe5d9e9,white:0xf6f0f6,dark:0x493c4a};
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.62});
function ball(g,c,p,s){const m=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),mat(c));m.position.set(...p);m.scale.set(...s);m.castShadow=true;g.add(m);return m;}
function capsule(g,c,a,b,r){const d=new THREE.Vector3(...b).sub(new THREE.Vector3(...a));const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,Math.max(.02,d.length()-2*r),5,14),mat(c));m.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.castShadow=true;g.add(m);return m;}
function createPart(species,id){
 const g=new THREE.Group();g.name=id;g.userData.species=species;g.userData.part=id;
 const pika=species==='pika',base=pika?C.yellow:C.lavender,shade=pika?C.yellow2:C.purple2;
 if(id==='head'){
  ball(g,base,[0,0,0],pika?[.57,.5,.46]:[.56,.65,.46]);
  if(pika){
   capsule(g,shade,[-.3,.3,0],[-.43,1.02,0],.115);capsule(g,base,[.3,.3,0],[.43,1.02,0],.115);
   ball(g,C.brown,[-.43,.96,.01],[.08,.14,.09]);ball(g,C.brown,[.43,.96,.01],[.08,.14,.09]);
   ball(g,C.dark,[-.21,.02,.41],[.05,.075,.03]);ball(g,C.dark,[.21,.02,.41],[.05,.075,.03]);
   ball(g,C.red,[-.39,-.17,.36],[.12,.1,.04]);ball(g,C.red,[.39,-.17,.36],[.12,.1,.04]);
   ball(g,C.cream,[0,-.17,.4],[.12,.07,.035]);
  }else{
   ball(g,C.white,[0,.38,-.02],[.24,.35,.27]);
   capsule(g,C.white,[-.34,.32,0],[-.43,.84,0],.11);capsule(g,C.white,[.34,.32,0],[.43,.84,0],.11);
   ball(g,C.purple2,[-.21,-.02,.4],[.07,.12,.035]);ball(g,C.purple2,[.21,-.02,.4],[.07,.12,.035]);
   ball(g,C.dark,[0,-.2,.41],[.07,.04,.03]);
  }
 }
 if(id==='torso'){
  ball(g,base,[0,0,0],pika?[.4,.55,.32]:[.39,.62,.33]);
  if(pika)ball(g,C.cream,[0,-.12,.28],[.25,.29,.07]);
  else{ball(g,C.white,[0,.18,.28],[.24,.29,.07]);ball(g,C.purple2,[0,-.34,.2],[.18,.16,.06]);}
 }
 if(id==='left_arm'||id==='right_arm'){
  const s=id==='left_arm'?-1:1;capsule(g,base,[0,.16,0],[s*.18,-.28,.02],pika?.12:.11);ball(g,base,[s*.18,-.3,.02],[.14,.13,.13]);
  if(!pika){for(let i=0;i<3;i++)capsule(g,C.white,[s*.18,-.3,.03],[s*(.28+i*.06),-.45,.04],.035);}
 }
 if(id==='left_leg'||id==='right_leg'){
  const s=id==='left_leg'?-1:1;capsule(g,base,[0,.16,0],[s*.08,-.32,.02],pika?.14:.12);ball(g,base,[s*.1,-.36,.14],[pika?.21:.19,.11,.27]);
  if(!pika)ball(g,C.white,[s*.1,-.36,.2],[.1,.05,.17]);
 }
 if(id==='tail'){
  if(pika){
   const pts=[new THREE.Vector3(0,-.4,0),new THREE.Vector3(.18,-.15,0),new THREE.Vector3(.15,.1,0),new THREE.Vector3(.45,.2,0),new THREE.Vector3(.45,.45,0),new THREE.Vector3(.72,.45,0),new THREE.Vector3(.72,.7,0)];
   const curve=new THREE.CatmullRomCurve3(pts);const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,32,.12,10,false),mat(C.yellow2));tube.castShadow=true;g.add(tube);const tip=new THREE.Mesh(new THREE.BoxGeometry(.3,.24,.14),mat(C.yellow));tip.position.set(.72,.72,0);g.add(tip);
  }else{
   const pts=[new THREE.Vector3(0,-.38,0),new THREE.Vector3(.25,-.2,-.02),new THREE.Vector3(.53,.02,-.04),new THREE.Vector3(.7,.36,-.02),new THREE.Vector3(.5,.68,0),new THREE.Vector3(.16,.76,.02)];
   const curve=new THREE.CatmullRomCurve3(pts);const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,40,.18,14,false),mat(C.purple2));tube.castShadow=true;g.add(tube);
   const inner=new THREE.Mesh(new THREE.TubeGeometry(curve,40,.1,12,false),mat(C.purple));inner.position.z=.025;g.add(inner);
  }
 }
 return g;
}
const partLabels={head:['頭部','🙂'],torso:['身體','🧍'],left_arm:['左手臂','💪'],right_arm:['右手臂','💪'],left_leg:['左腳','🦶'],right_leg:['右腳','🦶'],tail:['尾巴','〰️']};
let activeSpecies='pika',placed=[],selected=null,dragging=null,dragKind='',dragPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0),raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),hit=new THREE.Vector3(),offset=new THREE.Vector3(),preview=null,previewId=null,previewSpecies=null;
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1300)}
function tray(){
 const box=document.querySelector('#partsTray');box.innerHTML='';
 Object.keys(partLabels).forEach(id=>{
  const card=document.createElement('div');card.className='partCard';card.dataset.part=id;card.innerHTML=`<span class="emoji">${partLabels[id][1]}</span><b>${partLabels[id][0]}</b>`;
  card.addEventListener('pointerdown',ev=>{
   ev.preventDefault();if(preview)scene.remove(preview);
   preview=createPart(activeSpecies,id);preview.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=.76;}});scene.add(preview);previewId=id;previewSpecies=activeSpecies;dragKind='new';dragging=true;orbit.enabled=false;movePreview(ev);
   try{card.setPointerCapture(ev.pointerId)}catch(e){}
  });
  box.append(card);
 });
}
tray();
document.querySelectorAll('.speciesTab').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('.speciesTab').forEach(x=>x.classList.toggle('active',x===btn));activeSpecies=btn.dataset.species;tray();
}));
function canvasPoint(ev){const r=renderer.domElement.getBoundingClientRect();pointer.x=(ev.clientX-r.left)/r.width*2-1;pointer.y=-((ev.clientY-r.top)/r.height*2-1);raycaster.setFromCamera(pointer,camera);return raycaster.ray.intersectPlane(dragPlane,hit)?hit.clone():null;}
function movePreview(ev){const p=canvasPoint(ev);if(!p||!preview)return;preview.position.copy(p);preview.position.z=.12;}
function pickPlaced(ev){const r=renderer.domElement.getBoundingClientRect();pointer.x=(ev.clientX-r.left)/r.width*2-1;pointer.y=-((ev.clientY-r.top)/r.height*2-1);raycaster.setFromCamera(pointer,camera);const meshes=[];placed.forEach(g=>g.traverse(o=>{if(o.isMesh){o.userData.owner=g;meshes.push(o)}}));const h=raycaster.intersectObjects(meshes,false);return h.length?h[0].object.userData.owner:null;}
function selectObject(g){selected=g;document.querySelector('#selectionTools').classList.toggle('show',!!g);document.querySelectorAll('#rotateLeft,#rotateRight,#smaller,#bigger').forEach(b=>b.disabled=!g);document.querySelector('#selectedName').textContent=g?partLabels[g.userData.part][0]:'已選取';}
renderer.domElement.addEventListener('pointerdown',ev=>{
 if(dragging)return;const g=pickPlaced(ev);
 if(g){selectObject(g);dragging=true;dragKind='move';orbit.enabled=false;const p=canvasPoint(ev);if(p)offset.copy(g.position).sub(p);renderer.domElement.setPointerCapture(ev.pointerId);}
 else{selectObject(null);}
});
window.addEventListener('pointermove',ev=>{if(!dragging)return;if(dragKind==='new')movePreview(ev);else if(dragKind==='move'&&selected){const p=canvasPoint(ev);if(p)selected.position.copy(p.add(offset));}});
window.addEventListener('pointerup',ev=>{
 if(!dragging)return;
 if(dragKind==='new'&&preview){
  const r=renderer.domElement.getBoundingClientRect(),inside=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom;
  if(inside){preview.materialDummy=null;preview.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.transparent=false;o.material.opacity=1;}});preview.userData.part=previewId;preview.userData.species=previewSpecies;preview.userData.serial=Date.now()+Math.random();placed.push(preview);selectObject(preview);toast('零件已放上工作區，可以繼續移動！');}
  else{scene.remove(preview);preview=null;}
 }else if(dragKind==='move'){toast('位置已調整');}
 dragging=false;dragKind='';preview=null;previewId=null;previewSpecies=null;orbit.enabled=true;updateCount();
});
window.addEventListener('pointercancel',()=>{if(dragKind==='new'&&preview)scene.remove(preview);dragging=false;dragKind='';preview=null;orbit.enabled=true;});
function updateCount(){document.querySelector('#count').textContent='已放置 '+placed.length+' 件';}
document.querySelector('#rotateLeft').onclick=()=>{if(selected)selected.rotation.z+=Math.PI/12;};
document.querySelector('#rotateRight').onclick=()=>{if(selected)selected.rotation.z-=Math.PI/12;};
document.querySelector('#smaller').onclick=()=>{if(selected)selected.scale.multiplyScalar(.9);};
document.querySelector('#bigger').onclick=()=>{if(selected)selected.scale.multiplyScalar(1.1);};
document.querySelector('#front').onclick=()=>{if(selected)selected.position.z=.35;};
document.querySelector('#duplicate').onclick=()=>{if(!selected)return;const g=selected.clone(true);g.position.x+=.28;g.position.y-=.18;g.userData.serial=Date.now()+Math.random();placed.push(g);scene.add(g);selectObject(g);updateCount();toast('已複製零件');};
document.querySelector('#delete').onclick=()=>{if(!selected)return;scene.remove(selected);placed=placed.filter(x=>x!==selected);selectObject(null);updateCount();toast('零件已刪除');};
document.querySelector('#clearBtn').onclick=()=>{placed.forEach(g=>scene.remove(g));placed=[];selectObject(null);updateCount();toast('工作區已清空');};
document.querySelector('#viewBtn').onclick=()=>{camera.position.set(0,2.3,9.4);orbit.target.set(0,1.4,0);orbit.update();};
function resize(){const w=stageWrap.clientWidth,h=stageWrap.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}
new ResizeObserver(resize).observe(stageWrap);
function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera);}
animate();
</script>
